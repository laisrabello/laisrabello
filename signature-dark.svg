<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100" role="img"><title>Laís Rabello — tecnologia, dados e soluções de mídia</title><style>:root{--text:#e8f0f7;--muted:#9eafbf;--blue:#86b6ff;--green:#7ed8c5}text{font-family:Arial,Helvetica,sans-serif}.code{font-family:Consolas,monospace}.reveal{animation:enter 1s ease-out both}@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.reveal{animation:none}}</style><rect width="1000" height="100" rx="20" fill="#0d1723"/><text x="32" y="42" font-size="13" fill="var(--muted)" class="code">$ whoami</text><text x="32" y="75" font-size="18" fill="var(--text)" >Laís Rabello / learning, building &amp; solving.</text><rect x="462" y="61" width="9" height="17" fill="#7ed8c5"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.6s" repeatCount="3"/></rect></svg>